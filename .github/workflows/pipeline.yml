name: pipeline

on:
  push:
  workflow_dispatch:

jobs:



############## TESTE UNITARIO ################
  Teste-UNITARIO:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - run: mvn test

      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco



  code-analisys: 
    runs-on: ubuntu-latest 
    needs: Teste-UNITARIO
    steps: 
    - uses: actions/checkout@v2 
      with: 
        fetch-depth: 0 
    - name: Set up JDK 21 
      uses: actions/setup-java@v6 
      with: 
        java-version: 21 
        distribution: 'temurin'  
         
    - name: Cache SonarCloud packages 
      uses: actions/cache@v3 
      with: 
        path: ~/.sonar/cache 
        key: ${{ runner.os }}-sonar 
        restore-keys: ${{ runner.os }}-sonar 
         
    - name: Cache Maven packages 
      uses: actions/cache@v3 
      with: 
        path: ~/.m2 
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }} 
        restore-keys: ${{ runner.os }}-m2 
         
    - name: Build and analyze 
      env: 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if  
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=FIAP2026


          
############## BUILD ################
  
  BUILD:
    runs-on: ubuntu-latest
    needs: code-analisys
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Display structure of downloaded files
        run: ls -R target/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./target/demo-0.0.2.7-SNAPSHOT.jar

      - name: Package
        run: mvn package
############## DEPLOY DEV ################
  deploy-STG:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' 
    needs: code-analisys
    steps:
      - name: Deploy
        run: echo "Deploy STG"
  
  Smoketest: 
    runs-on: ubuntu-latest 
    needs: deploy-STG 
    if: github.ref == 'refs/heads/develop' 
    steps: 
      - uses: actions/checkout@v3 
      - name: Deploy  
        shell: bash 
        run: | 
          sh 'src/main/scripts/smoketest.sh'
          
############## DEPLOY PRE-PRD ################

  deploy-PRE:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' 
    needs: code-analisys
    steps:
      - name: Deploy
        run: echo "Deploy PRE"

  Smoketest-PRE: 
      runs-on: ubuntu-latest 
      needs: deploy-Pre
      if: github.ref == 'refs/heads/release' 
      steps: 
        - uses: actions/checkout@v3 
        - name: Deploy  
          shell: bash 
          run: | 
            sh 'src/main/scripts/smoketest.sh'           
          
  testeFuncionais-PRE: 
    runs-on: ubuntu-latest 
    needs: Smoketest-PRE 
    if: github.ref == 'refs/heads/release' 
    steps: 
      - uses: actions/checkout@v3 
      - name: Deploy  
        shell: bash 
        run: | 
          sh 'src/main/scripts/testesFuncionais.sh'




############## DEPLOY PRD ################
  deploy-PRD:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' 
    needs: BUILD
    steps:
      - name: Deploy
        run: echo "Deploy PRODUCAO"
        
  Smoketest-PROD: 
    runs-on: ubuntu-latest 
    needs: deploy-PRD
     
    if: github.ref == 'refs/heads/main' 
    steps: 
      - uses: actions/checkout@v3 
      - name: Deploy  
        shell: bash 
        run: | 
            sh 'src/main/scripts/smoketest.sh'   
  Teste-Integrado: 
    runs-on: ubuntu-latest 
    needs: Smoketest-PROD
     
    if: github.ref == 'refs/heads/main' 
    steps: 
      - uses: actions/checkout@v3 
      - name: Deploy  
        shell: bash 
        run: | 
            sh 'src/main/scripts/smoketest.sh'



  ############## DEPLOY PERFOMANCE ################



  
